server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashatyt asset-tiedostot — kovat välimuistiajat
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback — kaikki tuntemattomat reitit menevät index.htmliin
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # /api ei tule koskaan tähän containeriin — Caddy reitittää sen suoraan
  # reveal-data-API:lle ennen kuin pyyntö osuu nginxiin. Jos jokin pyyntö silti
  # päätyy tänne, palautetaan 404 ennemmin kuin index.html.
  location /api/ {
    return 404;
  }

  # Perusturvallisuusotsikoita
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
