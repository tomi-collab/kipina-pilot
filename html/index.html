<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kipinä Pilot</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101418;
      color: #f4f4f4;
    }
    main {
      max-width: 720px;
      padding: 40px;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      margin: 0 0 16px;
    }
    p {
      font-size: 1.15rem;
      line-height: 1.6;
      color: #cfd6dc;
    }
    .badge {
      display: inline-block;
      margin-bottom: 24px;
      padding: 8px 14px;
      border: 1px solid #4bffb5;
      border-radius: 999px;
      color: #4bffb5;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">Kipinä Pilot · online</div>
    <h1>Ideasta ensimmäiseksi askeleeksi.</h1>
    <p>
      Kipinä on Digiterin pilottipalvelu, joka auttaa nuoria sanoittamaan omia ideoitaan
      ja viemään niitä kohti toimivaa digitaalista ratkaisua.
    </p>
  </main>
</body>
</html>
