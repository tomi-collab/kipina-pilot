services:
  kipina-frontend:
    build:
      context: ./apps/frontend
    image: kipina-pilot-frontend
    container_name: kipina-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

  kipina-reveal-data-api:
    build:
      context: ./apps/reveal-data-api
    image: kipina-pilot-reveal-data-api
    container_name: kipina-reveal-data-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      KIPINA_ACCESS_CODE: "${KIPINA_ACCESS_CODE}"
      REVEAL_ENGINE_BASE_URL: "${REVEAL_ENGINE_BASE_URL}"
      REVEAL_ENGINE_TIMEOUT_SECONDS: "${REVEAL_ENGINE_TIMEOUT_SECONDS:-60}"
      KIPINA_TENANTS: "${KIPINA_TENANTS}"
    ports:
      - "127.0.0.1:8081:8080"

  concept-api:
    build:
      context: ./apps/concept-api
    image: kipina-pilot-concept-api
    container_name: kipina-concept-api
    restart: unless-stopped
    environment:
      GCP_PROJECT_ID: "${GCP_PROJECT_ID:-apply-project-35406}"
      GCP_LOCATION: "${GCP_LOCATION:-europe-west4}"
      CONCEPT_GEMINI_MODEL: "${CONCEPT_GEMINI_MODEL:-gemini-2.5-pro}"
      TEMPLATES_PATH: "/app/templates.json"
      GOOGLE_APPLICATION_CREDENTIALS: "/secrets/gcp-sa.json"
    volumes:
      - ./secrets/gcp-sa.json:/secrets/gcp-sa.json:ro
      - ./shared/templates.json:/app/templates.json:ro
    ports:
      - "127.0.0.1:8082:8080"

  prototype-api:
    build:
      context: ./apps/prototype-api
    image: kipina-pilot-prototype-api
    container_name: kipina-prototype-api
    restart: unless-stopped
    environment:
      GCP_PROJECT_ID: "${GCP_PROJECT_ID:-apply-project-35406}"
      GCP_LOCATION: "${PROTOTYPE_GCP_LOCATION:-europe-west4}"
      GEMINI_MODEL: "${PROTOTYPE_GEMINI_MODEL:-gemini-2.5-pro}"
      TEMPLATE_PROXY_BASE_URL: "http://template-proxy:8080"
      TEMPLATES_PATH: "/app/templates.json"
      GOOGLE_APPLICATION_CREDENTIALS: "/secrets/gcp-sa-vibe.json"
    volumes:
      - ./secrets:/secrets:ro
      - ./shared/templates.json:/app/templates.json:ro
    ports:
      - "127.0.0.1:8083:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/prototype/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  template-proxy:
    build:
      context: ./apps/template-proxy
    image: kipina-pilot-template-proxy
    container_name: kipina-template-proxy
    restart: unless-stopped
    environment:
      GCP_PROJECT_ID: "${GCP_PROJECT_ID:-apply-project-35406}"
      TEMPLATE_PROXY_LOCATION: "${TEMPLATE_PROXY_LOCATION:-europe-west4}"
      TEMPLATE_GEMINI_MODEL: "${TEMPLATE_GEMINI_MODEL:-gemini-2.5-flash}"
      DIGITRANSIT_SUBSCRIPTION_KEY: "${DIGITRANSIT_SUBSCRIPTION_KEY:-}"
      DIGITRANSIT_ROUTING_URL: "${DIGITRANSIT_ROUTING_URL:-https://api.digitransit.fi/routing/v2/hsl/gtfs/v1}"
      TEMPLATES_PATH: "/app/templates.json"
      GOOGLE_APPLICATION_CREDENTIALS: "/secrets/gcp-sa-vibe.json"
    volumes:
      - ./secrets/gcp-sa-vibe.json:/secrets/gcp-sa-vibe.json:ro
      - ./shared/templates.json:/app/templates.json:ro
    ports:
      - "127.0.0.1:8085:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/templates/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

